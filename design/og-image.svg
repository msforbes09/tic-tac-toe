<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <!-- Board: nine rounded tiles, the product itself as the picture. -->
  <g transform="translate(96 105)">
    <rect x="0" y="0" width="420" height="420" rx="44" fill="#1c1c1c"/>
    <g fill="#262626">
      <rect x="24" y="24" width="116" height="116" rx="26"/>
      <rect x="152" y="24" width="116" height="116" rx="26"/>
      <rect x="280" y="24" width="116" height="116" rx="26"/>
      <rect x="24" y="152" width="116" height="116" rx="26"/>
      <rect x="152" y="152" width="116" height="116" rx="26"/>
      <rect x="280" y="152" width="116" height="116" rx="26"/>
      <rect x="24" y="280" width="116" height="116" rx="26"/>
      <rect x="152" y="280" width="116" height="116" rx="26"/>
      <rect x="280" y="280" width="116" height="116" rx="26"/>
    </g>
    <!-- X wins the diagonal -->
    <g stroke="#8fa8ff" stroke-width="16" stroke-linecap="round" fill="none">
      <path d="M54 54 L110 110 M110 54 L54 110"/>
      <path d="M182 182 L238 238 M238 182 L182 238"/>
      <path d="M310 310 L366 366 M366 310 L310 366"/>
    </g>
    <g stroke="#ff9f7a" stroke-width="16" fill="none">
      <circle cx="338" cy="82" r="32"/>
      <circle cx="82" cy="338" r="32"/>
      <circle cx="210" cy="82" r="32"/>
    </g>
  </g>
  <!-- Copy -->
  <g font-family="Geist Variable, Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" fill="#fafafa">
    <text x="600" y="282" font-size="104" font-weight="700" letter-spacing="-4">Tic-Tac-Toe</text>
    <text x="600" y="356" font-size="40" fill="#b5b5b5">Three’s a win.</text>
    <text x="600" y="430" font-size="34" fill="#8a8a8a">Play a friend online, on the same</text>
    <text x="600" y="476" font-size="34" fill="#8a8a8a">phone, or take on the bot.</text>
    <text x="600" y="556" font-size="28" fill="#6d6d6d">tic-tac-toe.iam4bs.dev</text>
  </g>
</svg>
